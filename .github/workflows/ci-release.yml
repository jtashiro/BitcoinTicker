name: CI Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Decoding keystore..."
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      - name: Create keystore properties
        if: env.HAS_KEYSTORE == 'true'
        run: |
          cat > keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute to gradlew
        run: chmod +x ./gradlew

      - name: Build release AAB
        run: |
          ./gradlew :app:clean :app:bundleRelease --no-daemon --warning-mode all

      - name: Upload mapping file as artifact (optional)
        if: ${{ hashFiles('app/build/outputs/mapping/release/mapping.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mapping.txt
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Create Git tag
        id: tag
        run: |
          VERSION=$(./gradlew -q :app:printVersion | sed -n 's/Version Name: //p' | tr -d '\r')
          TAG_NAME="v${VERSION}"
          echo "Tagging $TAG_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG_NAME || true
          git push origin --tags || true
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with AAB
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
